# Copy these into your own secrets.yaml (ESPHome Builder: "Secrets" in the top-right menu)
# and fill them in. Don't commit your real values.
wifi_ssid: "YourSSID"
wifi_password: "YourPassword"
# Generate one in ESPHome Builder, or with: openssl rand -base64 32
api_encryption_key: "REPLACE_WITH_32_BYTE_BASE64_KEY"
ota_password: "choose-an-ota-password"
# At least 8 characters. Used for the setup hotspot if Wi-Fi can't connect.
fallback_ap_password: "choose-a-hotspot-password"
# Free key from https://docs.airnowapi.org/ (leave as is to skip outdoor data)
airnow_api_key: "YOUR_AIRNOW_API_KEY"
airnow_zip: "10001"
