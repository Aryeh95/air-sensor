# Desktop preview of the e-paper screens with made-up readings (no hardware needed).
# Requires SDL2 (e.g. `apt install libsdl2-dev` / `brew install sdl2`), then:
#   esphome run eg_host.yaml
# Preview the trend page, Fahrenheit or the Wi-Fi-off icon with e.g.:
#   esphome -s preview_page 1 -s use_fahrenheit true -s preview_wifi false run eg_host.yaml
substitutions:
  preview_page: "0"
  preview_wifi: "true"
  use_fahrenheit: "false"

esphome:
  name: sdl
  includes:
    - aqi_algo.h
    - display_renderer.h
  on_boot:
    then:
      - lambda: |-
          // 24 hours of made-up 5-minute averages, oldest first
          for (int i = 0; i < ReadingHistory::SLOTS; i++) {
            float t = i / 12.0f;  // hours since the start
            float co2 = 620 + 520 * std::max(0.0f, std::sin((t - 2) / 24.0f * 6.283f)) + 120 * std::sin(t * 1.7f);
            float pm25 = 5 + 2 * std::sin(t * 0.9f) + (t > 17.5f && t < 19.0f ? 22 * std::sin((t - 17.5f) * 2.1f) : 0);
            ui.history.push_bucket_for_preview(co2, pm25);
          }
          ui.history.set_trends_for_preview(Trend::UP, Trend::DOWN);
          set_outdoor(OutdoorSource::PURPLEAIR, 42, 10.1f);
          record_reading(1214, 8);

host:

logger:

font:
  - file: 'gfonts://Montserrat'
    id: montserrat_20
    size: 20
    glyphs: "!/%()+&=,-_.:·°µ³0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

  - file: 'gfonts://Montserrat'
    id: montserrat_24
    size: 24
    glyphs: "!/%()+&=,-_.:·°µ³0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

  - file: 'gfonts://Montserrat@600'
    id: montserrat_36
    size: 36
    glyphs: "!/%()+&=,-_.:·°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

  - file: 'gfonts://Montserrat@600'
    id: montserrat_48
    size: 48
    glyphs: "!/%()+&=,-_.:·°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

image:
  defaults:
    type: binary
    resize: 140x140
  images:
    - file: "open_window.png"
      id: img_window_open
    - file: "purifier.png"
      id: img_purifier
      resize: 130x130
    - file: "ok.png"
      id: img_ok
    - file: "mdi:window-closed-variant"
      id: img_keep_closed
    - file: "mdi:water-off-outline"
      id: img_too_dry
    - file: "mdi:water-alert-outline"
      id: img_too_humid
    - file: "mdi:timer-sand"
      id: img_waiting
    - file: "mdi:alert-circle-outline"
      id: img_fault
    - file: "mdi:wifi-off"
      id: img_wifi_off
      resize: 28x28

time:
  - platform: host
    id: sys_time

display:
  - platform: sdl
    dimensions:
      width: 800
      height: 480
    update_interval: 1s
    lambda: |-
      ui.page = ${preview_page};
      ui.page_since = millis();
      //                temp  hum  pm1  pm2.5  pm4  pm10  co2   voc  nox
      Readings r{22.3f, 27, 5, 8, 12, 14, 1214, 42, 1};
      update_state(r, id(sys_time).now(), ${preview_wifi}, ${use_fahrenheit});
      draw_screen(it, Icons{id(img_ok), id(img_window_open), id(img_purifier), id(img_keep_closed),
                            id(img_too_dry), id(img_too_humid), id(img_waiting), id(img_fault),
                            id(img_wifi_off)});
