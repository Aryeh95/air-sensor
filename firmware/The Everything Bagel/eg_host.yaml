# Desktop preview of the e-paper layout (no hardware needed).
# Requires SDL2 (e.g. `apt install libsdl2-dev` / `brew install sdl2`), then:
#   esphome run eg_host.yaml
substitutions:
  mock_temp: "22.3"
  mock_hum: "47"
  mock_pm10: "5"
  mock_pm25: "8"
  mock_pm40: "12"
  mock_pm100: "14"
  mock_voc: "42"
  mock_nox: "1"
  mock_co2: "1214"

esphome:
  name: sdl
  includes:
    - aqi_algo.h
    - display_renderer.h

host:

logger:

font:
  - file: 'gfonts://Montserrat'
    id: montserrat_20
    size: 20
    glyphs: "!/%()+&=,-_.:°µ³0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

  - file: 'gfonts://Montserrat'
    id: montserrat_24
    size: 24
    glyphs: "!/%()+&=,-_.:°µ³0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

  - file: 'gfonts://Montserrat@600'
    id: montserrat_36
    size: 36
    glyphs: "!/%()+&=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

  - file: 'gfonts://Montserrat@600'
    id: montserrat_48
    size: 48
    glyphs: "!/%()+&=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

image:
  defaults:
    type: binary
    resize: 160x160
  images:
    - file: "open_window.png"
      id: img_window_open
    - file: "purifier.png"
      id: img_purifier
      resize: 150x150
    - file: "ok.png"
      id: img_ok

time:
  - platform: host
    id: host_time

sensor:
  - platform: template
    id: pm10
    lambda: return ${mock_pm10};
  - platform: template
    id: pm25
    lambda: return ${mock_pm25};
  - platform: template
    id: pm40
    lambda: return ${mock_pm40};
  - platform: template
    id: pm100
    lambda: return ${mock_pm100};
  - platform: template
    id: nox
    lambda: return ${mock_nox};
  - platform: template
    id: co2
    lambda: return ${mock_co2};
  - platform: template
    id: voc
    lambda: return ${mock_voc};
  - platform: template
    id: temp
    lambda: return ${mock_temp};
  - platform: template
    id: hum
    lambda: return ${mock_hum};

display:
  - platform: sdl
    dimensions:
      width: 800
      height: 480
    update_interval: 1s
    lambda: |-
      AQIAdvice advice = AQIAlgo::get_advice(${mock_co2}, ${mock_pm25}, ${mock_voc}, ${mock_hum});
      esphome::image::Image* current_icon = AQIAlgo::get_icon_from_action(
          advice.action, id(img_window_open), id(img_purifier), id(img_ok));

      draw_main_screen(
          it,
          current_icon,
          id(host_time).now(),
          advice.status,
          advice.action,
          advice.reason,
          ${mock_temp}, ${mock_hum},
          ${mock_pm10}, ${mock_pm25}, ${mock_pm40}, ${mock_pm100},
          ${mock_co2}, ${mock_voc}, ${mock_nox}
      );
