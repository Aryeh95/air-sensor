# Air quality monitor for:
#   - Seeed Studio XIAO ePaper Display Board EE05 (XIAO ESP32-S3 Plus + 24-pin e-paper driver)
#   - Good Display GDEY0426T82 4.26" 800x480 black/white e-paper (SSD1677)
#   - Sensirion SEN66
# No custom PCB required. See the README for wiring.
esphome:
  name: "air-quality-display"
  includes:
    - aqi_algo.h
    - display_renderer.h
  on_boot:
    priority: -100
    then:
      - script.execute: calculate_aqi

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  # Keep the ESP32 cool so it doesn't skew the SEN66 temperature reading
  cpu_frequency: 80MHZ
  framework:
    type: esp-idf

# This key can be generated in ESPHome Builder, or removed
api:
  encryption:
    key: "yourEncryptionKey"

ota:
  - platform: esphome
    password: "yourEspHomePassword"

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Air Sensor Fallback"
    password: "password"

captive_portal:

logger:
  # GPIO43 (the UART0 TX pin) is used as the e-paper power switch below
  hardware_uart: USB_SERIAL_JTAG

# The EE05 powers the e-paper (and the VCC_3V3 pin on its extension header) through a
# load switch on D6 / GPIO43, which is pulled low by default. Turn it on at boot.
switch:
  - platform: gpio
    id: epaper_power
    pin: GPIO43
    restore_mode: ALWAYS_ON
    internal: true

# SEN66 is wired to D4 (SDA) / D5 (SCL) on the EE05 extension header
i2c:
  sda: GPIO5
  scl: GPIO6
  frequency: 100kHz
  scan: true

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

# Key1 on the side of the EE05 forces a redraw
binary_sensor:
  - platform: gpio
    id: key1
    pin:
      number: GPIO2
      inverted: true
    on_press:
      - script.execute: calculate_aqi

font:
  - file: 'gfonts://Montserrat'
    id: montserrat_20
    size: 20
    glyphs: "!/%()+&=,-_.:°µ³0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

  - file: 'gfonts://Montserrat'
    id: montserrat_24
    size: 24
    glyphs: "!/%()+&=,-_.:°µ³0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

  - file: 'gfonts://Montserrat@600'
    id: montserrat_36
    size: 36
    glyphs: "!/%()+&=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

  - file: 'gfonts://Montserrat@600'
    id: montserrat_48
    size: 48
    glyphs: "!/%()+&=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

image:
  defaults:
    type: binary
    resize: 160x160
  images:
    - file: "open_window.png"
      id: img_window_open
    - file: "purifier.png"
      id: img_purifier
      resize: 150x150
    - file: "ok.png"
      id: img_ok

time:
  - platform: homeassistant
    id: HA_time

sensor:
  - platform: homeassistant
    id: ha_outdoor_pm25
    entity_id: sensor.outdoor_pm25
  - platform: homeassistant
    id: ha_outdoor_co2
    entity_id: sensor.outdoor_co2

  - platform: sen6x
    type: SEN66
    update_interval: 30s

    temperature:
      name: Temperature
      id: sen66_temp
      accuracy_decimals: 1
    humidity:
      name: Humidity
      id: sen66_humidity
    voc:
      name: VOC Index
      id: sen66_voc
    nox:
      name: NOx Index
      id: sen66_nox
    co2:
      name: Carbon Dioxide
      id: sen66_co2
    pm_1_0:
      name: PM <1µm Weight concentration
      id: sen66_pm10
    pm_2_5:
      name: PM <2.5µm Weight concentration
      id: sen66_pm25
    pm_4_0:
      name: PM <4µm Weight concentration
      id: sen66_pm40
    pm_10_0:
      name: PM <10µm Weight concentration
      id: sen66_pm100
      on_value:
        then:
          - script.execute: calculate_aqi

text_sensor:
  - platform: template
    id: aqi_status
    name: "AQI Overall Status"
    icon: "mdi:air-filter"

  - platform: template
    id: aqi_action
    name: "AQI Recommended Action"
    icon: "mdi:information-outline"

  - platform: template
    id: aqi_reason
    name: "AQI Action Reason"
    icon: "mdi:text-box-search-outline"

script:
  - id: calculate_aqi
    then:
      - lambda: |-
          // 1. Fetch live sensor data (fallback to NAN if sensor fails/is booting)
          float co2 = id(sen66_co2).has_state() ? id(sen66_co2).state : NAN;
          float pm2 = id(sen66_pm25).has_state() ? id(sen66_pm25).state : NAN;
          float voc = id(sen66_voc).has_state() ? id(sen66_voc).state : NAN;
          float hum = id(sen66_humidity).has_state() ? id(sen66_humidity).state : NAN;

          // 2. Fetch outdoor sensor data from HA (fallback to NAN if disconnected)
          float ext_co2 = id(ha_outdoor_co2).has_state() ? id(ha_outdoor_co2).state : NAN;
          float ext_pm2 = id(ha_outdoor_pm25).has_state() ? id(ha_outdoor_pm25).state : NAN;

          // 3. Process the data
          AQIAdvice advice = AQIAlgo::get_advice(co2, pm2, voc, hum, ext_co2, ext_pm2);

          // 4. Publish to our text sensors
          id(aqi_status).publish_state(advice.status);
          id(aqi_action).publish_state(advice.action);
          id(aqi_reason).publish_state(advice.reason);

      # 5. Tell the display to draw the new values
      - component.update: internal_display

display:
  - platform: epaper_spi
    id: internal_display
    # GDEY0426T82 uses the SSD1677 controller. This model preset matches it and sets the
    # EE04/EE05 pins: CS=GPIO44, DC=GPIO10, RESET=GPIO38, BUSY=GPIO4
    model: seeed-ee04-mono-4.26
    update_interval: never
    # Partial refreshes in between; a full (flashing) refresh every ~15 minutes clears ghosting
    full_update_every: 30
    # Landscape. Use rotation: 180 if you mount it the other way up.
    rotation: 0
    lambda: |-
      esphome::image::Image* current_icon = AQIAlgo::get_icon_from_action(
          id(aqi_action).state,
          id(img_window_open),
          id(img_purifier),
          id(img_ok)
      );

      draw_main_screen(
          it,
          current_icon,
          id(HA_time).now(),
          id(aqi_status).state,
          id(aqi_action).state,
          id(aqi_reason).state,
          id(sen66_temp).state,
          id(sen66_humidity).state,
          id(sen66_pm10).state,
          id(sen66_pm25).state,
          id(sen66_pm40).state,
          id(sen66_pm100).state,
          id(sen66_co2).state,
          id(sen66_voc).state,
          id(sen66_nox).state
      );
