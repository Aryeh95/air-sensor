# Air quality monitor for:
#   - Seeed Studio XIAO ePaper Display Board EE05 (XIAO ESP32-S3 Plus + 24-pin e-paper driver)
#   - Good Display GDEY0426T82 / Seeed 4.26" 800x480 black/white e-paper (SSD1677)
#   - Sensirion SEN66
# Works standalone: time comes from the internet (SNTP) and outdoor air quality from a nearby
# PurpleAir sensor (with an optional backup sensor), then AirNow as the fallback. Home Assistant is optional.
# Put your passwords, API keys, PurpleAir sensor number and ZIP code in secrets.yaml.
substitutions:
  # Show temperature in Fahrenheit on the display (Home Assistant always gets Celsius)
  use_fahrenheit: "false"
  # Added to the SEN66 temperature in °C. If the case makes it read 1.5 °C warm, use "-1.5".
  # Humidity is corrected to match.
  temperature_offset: "0.0"
  # For the clock: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: "America/New_York"
  # Outdoor air quality, first choice: a nearby outdoor PurpleAir sensor (EPA-corrected).
  # Read key from https://develop.purpleair.com/; the sensor number is the "select=" value in
  # its map link. Set purpleair_sensor_index to "0" to turn PurpleAir off.
  purpleair_api_key: !secret purpleair_api_key
  purpleair_sensor_index: !secret purpleair_sensor_index
  # Optional second sensor, only asked when the first has no usable reading ("0" = none)
  purpleair_backup_sensor_index: !secret purpleair_backup_sensor_index
  # Fallback: AirNow (US). Free key from https://docs.airnowapi.org/
  airnow_api_key: !secret airnow_api_key
  airnow_zip: !secret airnow_zip

esphome:
  name: "air-quality-display"
  includes:
    - aqi_algo.h
    - display_renderer.h
    - device_extras.h
  on_boot:
    priority: -100
    then:
      - script.execute: refresh

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  # Keep the ESP32 cool so it doesn't skew the SEN66 temperature reading
  cpu_frequency: 80MHZ
  framework:
    type: esp-idf

# For Home Assistant (optional). Without it connected, the device still works on its own.
api:
  encryption:
    key: !secret api_encryption_key
  # ESPHome normally reboots after 15 min without a Home Assistant connection; don't.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  on_connect:
    - delay: 5s
    - script.execute: fetch_purpleair
    - delay: 2s
    - script.execute: fetch_airnow

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Air Sensor Fallback"
    password: !secret fallback_ap_password

captive_portal:

logger:
  # GPIO43 (the UART0 TX pin) is used as the e-paper power switch below
  hardware_uart: USB_SERIAL_JTAG

# The EE05 powers the e-paper (and the VCC_3V3 pin on its extension header) through a
# load switch on D6 / GPIO43, which is pulled low by default. Turn it on at boot.
switch:
  - platform: gpio
    id: epaper_power
    pin: GPIO43
    restore_mode: ALWAYS_ON
    internal: true

# SEN66 is wired to D4 (SDA) / D5 (SCL) on the EE05 extension header.
# The ESP32's weak internal pull-ups are usually enough for a short cable at 100kHz.
# If the sensor isn't found or drops out, add 10k pull-ups to 3.3V (see the README).
i2c:
  sda: GPIO5
  scl: GPIO6
  sda_pullup_enabled: true
  scl_pullup_enabled: true
  frequency: 100kHz
  scan: true

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

http_request:
  timeout: 10s

time:
  - platform: sntp
    id: sys_time
    timezone: ${timezone}

# The three keys on the side of the EE05 (active low, external pull-ups)
binary_sensor:
  # Key1: redraw now
  - platform: gpio
    id: key1
    pin:
      number: GPIO2
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: request_redraw();
      - script.execute: refresh
  # Key2: switch between the main page and the 24-hour trend page
  - platform: gpio
    id: key2
    pin:
      number: GPIO3
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: toggle_page();
      - script.execute: refresh
  # Key3: full refresh (clears ghosting)
  - platform: gpio
    id: key3
    pin:
      number: GPIO8
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: |-
          EPaperFullRefresh::arm(id(internal_display));
          request_redraw();
      - script.execute: refresh

font:
  - file: 'gfonts://Montserrat'
    id: montserrat_20
    size: 20
    glyphs: "!/%()+&=,-_.:·°µ³0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

  - file: 'gfonts://Montserrat'
    id: montserrat_24
    size: 24
    glyphs: "!/%()+&=,-_.:·°µ³0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

  - file: 'gfonts://Montserrat@600'
    id: montserrat_36
    size: 36
    glyphs: "!/%()+&=,-_.:·°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

  - file: 'gfonts://Montserrat@600'
    id: montserrat_48
    size: 48
    glyphs: "!/%()+&=,-_.:·°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ abcdefghijklmnopqrstuvwxyzåäö"

image:
  defaults:
    type: binary
    resize: 140x140
  images:
    - file: "open_window.png"
      id: img_window_open
    - file: "purifier.png"
      id: img_purifier
      resize: 130x130
    - file: "ok.png"
      id: img_ok
    - file: "mdi:window-closed-variant"
      id: img_keep_closed
    - file: "mdi:water-off-outline"
      id: img_too_dry
    - file: "mdi:water-alert-outline"
      id: img_too_humid
    - file: "mdi:timer-sand"
      id: img_waiting
    - file: "mdi:alert-circle-outline"
      id: img_fault
    - file: "mdi:wifi-off"
      id: img_wifi_off
      resize: 28x28

sensor:
  - platform: sen6x
    type: SEN66
    update_interval: 30s

    temperature:
      name: Temperature
      id: sen66_temp
      accuracy_decimals: 1
      filters:
        - offset: ${temperature_offset}
    humidity:
      name: Humidity
      id: sen66_humidity
      filters:
        # Keep humidity consistent with the corrected temperature
        - lambda: return compensate_humidity(x, id(sen66_temp).raw_state, ${temperature_offset});
    voc:
      name: VOC Index
      id: sen66_voc
    nox:
      name: NOx Index
      id: sen66_nox
    pm_1_0:
      name: PM <1µm Weight concentration
      id: sen66_pm10
    pm_2_5:
      name: PM <2.5µm Weight concentration
      id: sen66_pm25
    pm_4_0:
      name: PM <4µm Weight concentration
      id: sen66_pm40
    pm_10_0:
      name: PM <10µm Weight concentration
      id: sen66_pm100
    co2:
      name: Carbon Dioxide
      id: sen66_co2
      # CO2 is the last value the driver publishes in each reading, so everything is fresh here
      on_value:
        then:
          - lambda: record_reading(x, id(sen66_pm25).state);
          - script.execute: refresh

  - platform: template
    id: indoor_aqi
    name: "Indoor US AQI (PM2.5)"
    icon: "mdi:air-filter"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: outdoor_aqi
    name: "Outdoor AQI"
    icon: "mdi:weather-hazy"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: outdoor_pm25
    name: "Outdoor PM2.5"
    unit_of_measurement: "µg/m³"
    accuracy_decimals: 1
    update_interval: never

text_sensor:
  - platform: template
    id: aqi_status
    name: "AQI Overall Status"
    icon: "mdi:air-filter"

  - platform: template
    id: aqi_action
    name: "AQI Recommended Action"
    icon: "mdi:information-outline"

  - platform: template
    id: aqi_reason
    name: "AQI Action Reason"
    icon: "mdi:text-box-search-outline"

  - platform: template
    id: outdoor_source
    name: "Outdoor Data Source"
    icon: "mdi:map-marker-radius"

script:
  # Works out the advice, updates Home Assistant and redraws the display if anything changed
  - id: refresh
    mode: queued
    then:
      - lambda: |-
          auto state_of = [](sensor::Sensor *s) { return s->has_state() ? s->state : NAN; };
          Readings r{state_of(id(sen66_temp)), state_of(id(sen66_humidity)), state_of(id(sen66_pm10)),
                     state_of(id(sen66_pm25)), state_of(id(sen66_pm40)), state_of(id(sen66_pm100)),
                     state_of(id(sen66_co2)), state_of(id(sen66_voc)), state_of(id(sen66_nox))};
          Frame f = update_state(r, id(sys_time).now(), wifi::global_wifi_component->is_connected(),
                                 ${use_fahrenheit});

          if (id(aqi_status).state != f.advice.status) id(aqi_status).publish_state(f.advice.status);
          if (id(aqi_action).state != f.advice.action) id(aqi_action).publish_state(f.advice.action);
          if (id(aqi_reason).state != f.advice.reason) id(aqi_reason).publish_state(f.advice.reason);
          float aqi = f.indoor_aqi >= 0 ? f.indoor_aqi : NAN;
          if (!(std::isnan(aqi) && std::isnan(id(indoor_aqi).state)) && id(indoor_aqi).state != aqi)
            id(indoor_aqi).publish_state(aqi);

          if (f.redraw) id(internal_display).update();

  # Current PM2.5 from a nearby outdoor PurpleAir sensor, EPA-corrected.
  # If it has no usable reading, the backup sensor is tried (so it costs no points normally).
  - id: fetch_purpleair
    mode: single
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: 'return std::string("${purpleair_sensor_index}") != "0";'
          then:
            - http_request.get:
                url: "https://api.purpleair.com/v1/sensors/${purpleair_sensor_index}?fields=name,location_type,last_seen,humidity,pm2.5_cf_1,pm2.5_cf_1_a,pm2.5_cf_1_b"
                request_headers:
                  X-API-Key: "${purpleair_api_key}"
                capture_response: true
                max_response_buffer_size: 2kB
                on_response:
                  then:
                    - lambda: |-
                        if (!handle_purpleair_response(response->status_code, body, "Main sensor"))
                          id(fetch_purpleair_backup).execute();
                    - script.execute: publish_outdoor
                on_error:
                  then:
                    - logger.log:
                        level: WARN
                        tag: purpleair
                        format: "Main sensor: request failed"
                    - script.execute: fetch_purpleair_backup

  - id: fetch_purpleair_backup
    mode: single
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: 'return std::string("${purpleair_backup_sensor_index}") != "0";'
          then:
            - http_request.get:
                url: "https://api.purpleair.com/v1/sensors/${purpleair_backup_sensor_index}?fields=name,location_type,last_seen,humidity,pm2.5_cf_1,pm2.5_cf_1_a,pm2.5_cf_1_b"
                request_headers:
                  X-API-Key: "${purpleair_api_key}"
                capture_response: true
                max_response_buffer_size: 2kB
                on_response:
                  then:
                    - lambda: handle_purpleair_response(response->status_code, body, "Backup sensor");
                    - script.execute: publish_outdoor
                on_error:
                  then:
                    - logger.log:
                        level: WARN
                        tag: purpleair
                        format: "Backup sensor: request failed"

  # Current outdoor air quality for your ZIP code from AirNow (fallback)
  - id: fetch_airnow
    mode: single
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: "https://www.airnowapi.org/aq/observation/zipCode/current/?format=application/json&zipCode=${airnow_zip}&distance=25&API_KEY=${airnow_api_key}"
                capture_response: true
                max_response_buffer_size: 4kB
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("airnow", "AirNow returned HTTP %d (check the API key and ZIP code)", response->status_code);
                          return;
                        }
                        AirNowResult result = parse_airnow(body);
                        if (!result.ok) {
                          ESP_LOGW("airnow", "No AirNow observations for this ZIP code");
                          return;
                        }
                        float pm25 = pm25_from_us_aqi(result.pm25_aqi);
                        ESP_LOGI("airnow", "Outdoor AQI %d, PM2.5 AQI %d (%.1f ug/m3)", result.aqi, result.pm25_aqi, pm25);
                        set_outdoor(OutdoorSource::AIRNOW, result.aqi, pm25);
                    - script.execute: publish_outdoor
                on_error:
                  then:
                    - logger.log:
                        level: WARN
                        tag: airnow
                        format: "AirNow request failed"

  # Sends the outdoor reading in use to Home Assistant and updates the display
  - id: publish_outdoor
    mode: queued
    then:
      - lambda: |-
          ActiveOutdoor o = active_outdoor(millis());
          float aqi = o.ok ? o.aqi : NAN;
          if (!(std::isnan(aqi) && std::isnan(id(outdoor_aqi).state)) && id(outdoor_aqi).state != aqi)
            id(outdoor_aqi).publish_state(aqi);
          if (!(std::isnan(o.pm25) && std::isnan(id(outdoor_pm25).state)) && id(outdoor_pm25).state != o.pm25)
            id(outdoor_pm25).publish_state(o.pm25);
          std::string source = o.ok ? o.source : "none";
          if (id(outdoor_source).state != source) id(outdoor_source).publish_state(source);
      - script.execute: refresh

interval:
  # Keeps the clock current and notices when the sensor stops responding
  - interval: 30s
    then:
      - script.execute: refresh
  # PurpleAir updates every couple of minutes; every 10 min keeps API usage low
  - interval: 10min
    then:
      - script.execute: fetch_purpleair
  # AirNow updates hourly
  - interval: 30min
    then:
      - script.execute: fetch_airnow
      - script.execute: publish_outdoor

display:
  - platform: epaper_spi
    id: internal_display
    # GDEY0426T82 uses the SSD1677 controller. This model preset matches it and sets the
    # EE04/EE05 pins: CS=GPIO44, DC=GPIO10, RESET=GPIO38, BUSY=GPIO4
    model: seeed-ee04-mono-4.26
    update_interval: never
    # Partial refreshes in between; a full (flashing) refresh every 30 redraws clears ghosting.
    # Key3 forces one at any time.
    full_update_every: 30
    # Landscape. Use rotation: 180 if you mount it the other way up.
    rotation: 0
    lambda: |-
      draw_screen(it, Icons{id(img_ok), id(img_window_open), id(img_purifier), id(img_keep_closed),
                            id(img_too_dry), id(img_too_humid), id(img_waiting), id(img_fault),
                            id(img_wifi_off)});
